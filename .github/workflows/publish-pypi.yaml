name: Publish PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            tag: manylinux_2_17_x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            tag: manylinux_2_17_aarch64
          - platform: macos-x64
            os: macos-13
            tag: macosx_10_13_x86_64
          - platform: macos-arm64
            os: macos-14
            tag: macosx_11_0_arm64
          - platform: windows-x64
            os: windows-latest
            tag: win_amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Build Deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build CLI
        run: bun install --frozen-lockfile && bun run build:cli

      - name: Build the CLI binary
        run: bun build --compile apps/cli/dist/cli.mjs --outfile "${{ runner.temp }}/tristack"

      - name: Build and tag the Python wheel
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="${{ runner.temp }}/tristack"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="${BIN}.exe"
          fi
          python scripts/build-wheel.py "$BIN" "$VERSION" --tag "${{ matrix.tag }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: packages/tristack-py/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    timeout-minutes: 10
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
