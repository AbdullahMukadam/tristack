name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate release commit
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Extract version from commit message
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%s | sed -nE 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: expected semver (x.y.z) in the head commit message"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            tag: manylinux_2_17_x86_64
            bin: tristack-linux-x64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            tag: manylinux_2_17_aarch64
            bin: tristack-linux-arm64
          - platform: macos-x64
            os: macos-14
            tag: macosx_10_13_x86_64
            bin: tristack-macos-x64
          - platform: macos-arm64
            os: macos-14
            tag: macosx_11_0_arm64
            bin: tristack-macos-arm64
          - platform: windows-x64
            os: windows-latest
            tag: win_amd64
            bin: tristack-windows-x64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
        shell: bash

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Build Binary
        run: bun build --compile apps/cli/dist/cli.mjs --outfile "${{ matrix.bin }}"
        shell: bash

      - name: Build Wheel
        run: python scripts/build-wheel.py "${{ matrix.bin }}" "${{ needs.check.outputs.version }}" --tag "${{ matrix.tag }}"
        shell: bash

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: ${{ matrix.bin }}*

      - name: Upload Wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: packages/tristack-py/dist/*.whl

  publish:
    name: Publish release + PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Reset tag
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          gh release delete "v$VERSION" --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "Error: empty version" && exit 1
          fi
          git config --local user.email "abdullahmukadam21@gmail.com"
          git config --local user.name "AbdullahMukadam"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          gh release create "v$VERSION" --title "Release v$VERSION" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to release
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          for file in artifacts/*; do
            echo "Uploading: $file"
            gh release upload "v$VERSION" "$file" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          echo "## Release v$VERSION Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "[v$VERSION](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Binaries" >> $GITHUB_STEP_SUMMARY
          for file in artifacts/*; do
            name=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            echo "- $name ($size)" >> $GITHUB_STEP_SUMMARY
          done