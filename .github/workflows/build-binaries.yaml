name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: tristack-macos-arm64
          - os: macos-13
            target: tristack-macos-x64
          - os: ubuntu-latest
            target: tristack-linux-x64
          - os: ubuntu-24.04-arm
            target: tristack-linux-arm64
          - os: windows-latest
            target: tristack-windows-x64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Build Binary
        run: bun build --compile apps/cli/dist/cli.mjs --outfile ${{ matrix.target }}
        shell: bash

      - name: Compress (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ${{ matrix.target }}
          tar czf ${{ matrix.target }}.tar.gz ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}*

  release:
    name: Attach to Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Artifacts
        run: ls -la artifacts/

      - name: Upload to GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Uploading artifacts for $TAG"
          for file in artifacts/*; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "## Build Complete: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          for file in artifacts/*; do
            name=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done
