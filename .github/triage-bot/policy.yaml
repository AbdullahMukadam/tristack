version: 1
default: block
rules:
  - id: only-tristack
    match: { tool: "github_*" }
    except: { args: { repo: { eq: AbdullahMukadam/tristack } } }
    decision: block
    reason: The triage bot only works on AbdullahMukadam/tristack

  - id: known-labels
    match: { tool: github_add_label }
    except:
      args:
        label:
          in:
            - bug
            - enhancement
            - question
            - documentation
            - duplicate
            - needs-repro
            - python
            - go
            - rust
            - fastapi
            - django
            - flask
            - litestar
            - chi
            - echo
            - fiber
            - gin
            - actix-web
            - axum
            - rocket
            - salvo
            - warp
    decision: block
    reason: Only the fixed triage labels can be added

  - id: hold-comments
    match: { tool: github_post_comment }
    decision: hold
    approvers: { roles: [admin, approver] }
    timeoutSeconds: 1800
    reason: Public comments are reviewed by a maintainer before they go out

  - id: allow-in-plan
    match: { inPlan: true }
    decision: allow
