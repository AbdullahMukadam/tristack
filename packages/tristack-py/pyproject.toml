[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tristack"
version = "0.1.0"
description = "Scaffold backend projects in Python, Go, and Rust"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["cli", "scaffold", "backend", "python", "go", "rust", "tristack"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://tristack.dev"
Repository = "https://github.com/tristack/tristack"
Issues = "https://github.com/tristack/tristack/issues"

[project.scripts]
tristack = "tristack:main"

[tool.hatch.build.targets.wheel]
packages = ["tristack"]
